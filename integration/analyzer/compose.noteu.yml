# bdd-gap-analyzer/compose.yaml을 첫 번째 -f 파일로 지정합니다.
# noteu 근거의 원본은 noteu 저장소에 두고 API만 읽기 전용으로 연결합니다.
services:
  api:
    volumes:
      - type: bind
        source: ../noteu/integration/analyzer/evidence/noteu
        target: /app/evidence/noteu
        read_only: true
        bind:
          create_host_path: false
    networks:
      default: {}
      error-reporting:
        aliases:
          - bdd-analyzer

networks:
  default: {}
  error-reporting:
    external: true
    name: bdd-error-reporting
