# 성능 측정 전용 설정 (docker compose 시 마운트됨)
spring:
  datasource:
    url: jdbc:mysql://mysql:3306/noteu?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&sslMode=DISABLED
    username: noteu
    password: noteu
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: create
    defer-datasource-initialization: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
        # 채팅방 목록(/rooms)은 member.role까지 fetch join해서 이 설정 없이도 2쿼리다.
        # 다른 화면의 LAZY 컬렉션 N+1에 대한 전역 안전망으로 유지 (개별 조회를 IN절 1회로 묶음).
        default_batch_fetch_size: 100
  sql:
    init:
      mode: always    # MySQL에서도 data.sql 시드 실행

server:
  port: 8080

# 원래 application.yml(로컬 전용, gitignored)에 있던 필수 설정
spring.servlet.multipart.location: /tmp/uploads

# 테스트는 폼 로그인만 사용. ClientRegistrationRepository 빈 생성용 더미 등록 (실제 소셜 로그인 불가)
spring.security.oauth2.client:
  registration:
    kakao:
      client-id: dummy
      client-secret: dummy
      client-authentication-method: client_secret_post
      authorization-grant-type: authorization_code
      redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
    google:
      client-id: dummy
      client-secret: dummy
      authorization-grant-type: authorization_code
      redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
    naver:
      client-id: dummy
      client-secret: dummy
      client-authentication-method: client_secret_post
      authorization-grant-type: authorization_code
      redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
  provider:
    kakao:
      authorization-uri: https://kauth.kakao.com/oauth/authorize
      token-uri: https://kauth.kakao.com/oauth/token
      user-info-uri: https://kapi.kakao.com/v2/user/me
      user-name-attribute: id
    naver:
      authorization-uri: https://nid.naver.com/oauth2.0/authorize
      token-uri: https://nid.naver.com/oauth2.0/token
      user-info-uri: https://openapi.naver.com/v1/nid/me
      user-name-attribute: response
